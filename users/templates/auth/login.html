{% extends 'base.html' %}
{% load static %}

{% block content %}

<main class="auth-page-wrapper">
  <div class="auth-background">
    <img src="{% static 'img/background/pattern.jpg' %}" alt="Background pattern">
  </div>

  <div class="auth-form-container">
    <div class="auth-container auth-container--login">

      <h2 class="auth-form-title">Welcome Back</h2>

      <form class="auth-form" method="post" action="{% url 'accounts:login' %}">
        {% csrf_token %}

        <div class="InputField">
          <label for="username">Login</label>
          <input type="text" id="username" name="username" class="Input" placeholder="Login" required>
        </div>

        <div class="InputField">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="Input" placeholder="Password" required>
        </div>

        <div class="ButtonGroup">
          <button type="submit" class="button button--primary">Sign In</button>
        </div>

        <div class="TextLink">
          <a href="#">Forgot password?</a>
        </div>

      </form>

      <div class="TextLink">
        <p>Don't have an account? <a href="{% url 'accounts:register' %}">Sign Up</a></p>
      </div>

    </div>
  </div>
</main>

{% endblock %}
