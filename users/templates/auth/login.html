  {% extends 'base.html' %}
  {% load static %}

  {% block content %}

  <main class="auth-page-wrapper">
    <div class="auth-background">
      <img src="{% static 'img/background/pattern.jpg' %}" alt="Background pattern">
    </div>

    <div class="auth-form-container">
      <div class="auth-container auth-container--login">
        <h2 class="auth-form-title">Welcome Back</h2>

        <form class="auth-form" method="post" action="{% url 'accounts:login' %}">
          {% csrf_token %}

          {% if form.non_field_errors %}
            <div class="alert alert-error">
              {{ form.non_field_errors }}
            </div>
          {% endif %}

          <div class="InputField">
            <label>Login</label>
            {{ form.username }}
          </div>

          <div class="InputField">
            <label>Password</label>
            {{ form.password }}
          </div>

          <div class="ButtonGroup">
            <button type="submit" class="button button--primary">
              Sign In
            </button>
          </div>
        </form>

        <div class="TextLink">
          <p>Don't have an account? <a href="{% url 'accounts:register' %}">Sign Up</a></p>
        </div>

      </div>
    </div>
  </main>

  {% endblock %}
