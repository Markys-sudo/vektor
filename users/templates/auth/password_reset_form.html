{% extends 'base.html' %}
{% load static %}

{% block content %}

<main class="auth-page-wrapper">
  <div class="auth-background">
    <img src="{% static 'img/background/pattern.jpg' %}" alt="Background pattern">
  </div>

  <div class="auth-form-container">
    <div class="auth-container auth-container--login">
      <!-- Изменен заголовок под процесс восстановления -->
      <h2 class="auth-form-title">Reset Password</h2>

      <!-- Форма отправляет запрос на нужный url сброса пароля -->
      <form class="auth-form" method="post" action="{% url 'accounts:password_reset' %}">
        {% csrf_token %}

        {% if form.non_field_errors %}
          <div class="alert alert-error" style="color: #dc3545; margin-bottom: 20px; font-weight: 500;">
            {{ form.non_field_errors }}
          </div>
        {% endif %}

        <!-- Поле ввода Email из встроенной формы PasswordResetView -->
        <div class="InputField" style="margin-bottom: 20px;">
          <label for="{{ form.email.id_for_label }}">Email Address</label>
          {{ form.email }}
          
          {% if form.email.errors %}
            <div class="text-danger" style="color: #dc3545; font-size: 0.85rem; margin-top: 5px;">
              {{ form.email.errors }}
            </div>
          {% endif %}
        </div>

        <div class="ButtonGroup" style="margin-top: 10px;">
          <button type="submit" class="button button--primary button--full-width">
            Send Reset Link
          </button>
        </div>
      </form>

      <!-- Ссылки для возврата на логин или регистрацию -->
      <div class="TextLink" style="margin-top: 20px;">
        <p>Remembered your password? <a href="{% url 'accounts:login' %}">Sign In</a></p>
      </div>
    </div>
  </div>
</main>

{% endblock %}
