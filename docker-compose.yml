# Production stack with Nginx & Cloudflare Tunnel
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shop}
      POSTGRES_USER: ${POSTGRES_USER:-shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shop} -d ${POSTGRES_DB:-shop}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
            python manage.py collectstatic --noinput &&
            gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_SETTINGS_MODULE: config.settings.prod
    env_file:
      - .env
    # ИСПРАВЛЕНО: Порт наружу больше открывать не нужно, Nginx сам все заберет внутри сети Docker
    expose:
      - "8000"
    volumes:
      - .:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ДОБАВЛЕНО: Сервис Nginx в качестве единой точки входа
  nginx:
    # Заменяем image на build
    build: ./nginx
    ports:
      - "8000:80"
    volumes:
      # Строку с конфигом УДАЛЯЕМ. Оставляем только статику и медиа:
      - media_data:/app/media:ro
      - static_data:/app/staticfiles:ro
    depends_on:
      - web


  worker:
    build: .
    command: celery -A config worker -l info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    env_file:
      - .env
    volumes:
      - .:/app
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - nginx  # ИСПРАВЛЕНО: Туннель теперь стучится напрямую в Nginx

volumes:
  postgres_data:
  media_data:
  static_data:
