upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name localhost;

    # Максимальный размер загружаемых файлов (например, картинок в медиа)
    client_max_body_size 20M;

    # Раздача статики Django
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
    }

    # Раздача медиа-файлов
    location /media/ {
        alias /app/media/;
        expires 30d;
    }

    # Перенаправление всех остальных запросов на Gunicorn (Django)
    location / {
        proxy_pass http://django;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }
}
